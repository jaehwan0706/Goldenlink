spring.datasource.url=jdbc:mysql://localhost:3306/goldenlink?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=admin12345

# 2. JPA / Hibernate Settings
