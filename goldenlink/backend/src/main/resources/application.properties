spring.application.name=goldenlink

# 1. Database Connection (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/goldenlink?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=admin12345

# 2. JPA / Hibernate Settings
# ddl-auto=update: Entity 클래스 기반으로 MySQL에 테이블 자동 생성/수정한다.
# JPA 기본 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 엔티티 필드명 DB 컬럼명 그대로 사용
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 3. View Engine (Thymeleaf)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 4. Encoding (한글 깨짐 방지)
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# 5. Logging (개발단계 쿼리 및 파라미터 확인용)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 6. openApi
openapi.serviceKey=a93e33c776b09126457d9b46f235e8d1c5d898b1544211d71cb8436af8bfffb5

# 7. Kakao REST API
kakao.restKey=7dd93083965269c6d73dc08000bda4a2

# 8. 앱 시작 시 data.sql 실행
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# 9. JPA가 초기화된 이후에 data.sql이 실행되도록 하는 설정
spring.jpa.defer-datasource-initialization=true